name: Release

# Trigger
on:
  push:
    tags:
      - v*
  pull_request:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      root_sol:
        description: "Release Title"
        required: true
        default: "SmsForwarder"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Check out the code
      - uses: actions/checkout@v4
      # SettingsjdkEnvironment11
      - name: set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'
          java-package: jdk
      # Retrieve signing credentials
      - name: Checkout Android Keystore
        uses: actions/checkout@v4
        with:
          repository: pppscn/keystore
          token: ${{ secrets.TOKEN }} # Repository connectiontoken,Need a separate configuration
          path: keystore # Root directory name of the repository
      # Packagerelease
      - name: Build with Gradle
        run: bash ./gradlew assembleRelease
      # Createrelease
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: SmsForwarder ${{ github.ref }}
          draft: false
          prerelease: false
      # Upload toreleaseResources
      - name: Upload release binaries
        uses: alexellis/upload-assets@0.2.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          asset_paths: '["./app/build/outputs/apk/release/SmsF_*"]'
